name: Source-only checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev
          python -m pip install -r requirements.txt
      - name: Reviewed content and history
        run: python tools/audit_publication.py
      - name: Synthetic contracts
        run: sh tests/run.sh
      - name: Build pinned QEMU overlay
        run: python tools/build.py --jobs 2
      - name: Machine registration
        run: |
          .build/build/qemu-system-arm -machine help | grep nikon-z7-display
          python tools/smoke_qemu.py .build/build/qemu-system-arm
          python tools/make_cmos.py
